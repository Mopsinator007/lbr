<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 fill=%27%23020d05%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2740%27 font-family=%27monospace%27 font-weight=%27bold%27 fill=%27%233dff7a%27 text-anchor=%27middle%27%3EMO%3C/text%3E%3C/svg%3E">

<style>
:root{color-scheme:dark;--bg:#020d05;--sf:#04170a;--sf2:#072410;--line:#13692f;--tx:#3dff7a;--mu:#1fa24d;--ac:#3dff7a;--gold:#b6ffc9;--glow:0 0 6px rgba(61,255,122,.75),0 0 18px rgba(61,255,122,.25);box-sizing:border-box}
*{box-sizing:inherit;border-radius:0!important}
html{background:#0f1109}
body{margin:0;padding:16px;min-height:100vh;background:radial-gradient(circle at 50% 0,#22261a,#0b0d07);font:20px/1.25 "VT323","Share Tech Mono","Courier New",ui-monospace,monospace;color:var(--tx);letter-spacing:.02em}
.w{position:relative;height:calc(100vh - 32px);overflow:auto;background:radial-gradient(ellipse at 50% 40%,#04200d 0,var(--bg) 75%);border:12px solid #20241a;border-radius:28px!important;box-shadow:inset 0 0 0 2px #46503a,inset 0 0 90px rgba(61,255,122,.14),0 0 0 2px #3b4230,0 30px 80px #000;max-width:1400px;margin:0 auto;padding:22px 24px 60px;text-shadow:var(--glow);animation:flick 5s infinite}
@keyframes flick{0%,100%{filter:brightness(1)}47%{filter:brightness(1.03)}50%{filter:brightness(.96)}53%{filter:brightness(1.04)}}
body:after{content:"";position:fixed;inset:16px;border-radius:28px!important;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);mix-blend-mode:multiply}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--line)}
img{filter:grayscale(1) sepia(1) hue-rotate(68deg) saturate(3.2) brightness(.82) contrast(1.15)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--line)}
h1{margin:0;font-size:40px;font-weight:400;letter-spacing:.08em}h1 i{font-style:normal;color:var(--gold)}h1:after{content:"█";animation:blink 1s steps(1) infinite;margin-left:6px}
@keyframes blink{50%{opacity:0}}.mu{color:var(--mu);font-size:17px}
.tabs{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line)}
.tabs button{background:none;border:0;border-right:1px solid var(--line);color:var(--mu);font:inherit;font-size:21px;text-transform:uppercase;padding:4px 16px;cursor:pointer;text-shadow:inherit}.tabs button:last-child{border-right:0}
.tabs button:hover{color:var(--tx);background:var(--sf2)}.tabs button.on{background:var(--tx);color:#021008;text-shadow:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{border:1px solid var(--line);background:var(--sf);padding:8px 14px;position:relative}.k:before{content:"";position:absolute;left:-1px;top:-1px;width:10px;height:10px;border-left:2px solid var(--tx);border-top:2px solid var(--tx)}
.k b{display:block;font-size:38px;font-weight:400;line-height:1.05}.k span{color:var(--mu);font-size:16px;text-transform:uppercase;letter-spacing:.12em}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select{background:transparent;border:1px solid var(--line);color:var(--tx);padding:5px 10px;font:inherit;outline:0;max-width:100%;text-shadow:inherit;caret-color:var(--tx)}
select option{background:#031007;color:var(--tx)}
input:focus,select:focus{border-color:var(--tx);box-shadow:var(--glow)}input::placeholder{color:#157a37}
.chip{background:transparent;border:1px solid var(--line);color:var(--mu);padding:1px 12px;cursor:pointer;font:inherit;font-size:18px;text-transform:uppercase;text-shadow:inherit}.chip:hover{color:var(--tx);border-color:var(--tx)}.chip.on{background:var(--tx);color:#021008;border-color:var(--tx);text-shadow:none}
button.b{background:var(--tx);color:#021008;border:1px solid var(--tx);font:inherit;font-size:19px;text-transform:uppercase;padding:2px 14px;cursor:pointer;text-shadow:none}button.b:hover{background:transparent;color:var(--tx);box-shadow:var(--glow)}
button.b.g{background:transparent;color:var(--tx);border-color:var(--line);text-shadow:inherit}button.b.g:hover{border-color:var(--tx)}button.b.on{background:var(--gold);border-color:var(--gold);color:#021008}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.g{background:var(--sf);border:1px solid var(--line);display:flex;flex-direction:column;transition:.12s}.g:hover{border-color:var(--tx);box-shadow:var(--glow),inset 0 0 20px rgba(61,255,122,.08)}
.art{aspect-ratio:460/215;position:relative;overflow:hidden;display:grid;place-items:center;font-size:48px;color:var(--mu);border-bottom:1px solid var(--line);background:#031a0a!important}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px);pointer-events:none}
.mb{position:absolute;top:6px;right:6px;z-index:2;background:rgba(2,13,5,.85);border:1px solid var(--tx);color:var(--tx);padding:0 8px;font:inherit;font-size:16px;text-transform:uppercase;cursor:pointer;text-shadow:inherit}.mb.on{background:var(--gold);color:#021008;text-shadow:none}
.bg{position:absolute;left:6px;top:6px;z-index:2;background:rgba(2,13,5,.85);border:1px solid var(--tx);padding:0 8px;font-size:16px}
.gb{padding:8px 11px 10px;display:flex;flex-direction:column;gap:4px;flex:1}.nm{font-size:22px;line-height:1.05;text-transform:uppercase}
.st{font-size:26px;line-height:1;cursor:pointer;width:max-content;color:transparent;-webkit-background-clip:text;background-clip:text;user-select:none;text-shadow:none;letter-spacing:.04em}
.lk{display:flex;gap:14px;font-size:17px;margin-top:auto;flex-wrap:wrap}a{color:var(--tx);text-decoration:underline;text-decoration-style:dotted}a:hover{background:var(--tx);color:#021008;text-shadow:none}
.p{border:1px solid var(--line);background:var(--sf);padding:14px 18px;margin-bottom:14px}.p h2{margin:0 0 6px;font-size:26px;font-weight:400;text-transform:uppercase;letter-spacing:.08em}.p h2:before{content:"[ "}.p h2:after{content:" ]"}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}.duel .g{cursor:pointer}.vs{color:var(--gold);font-size:40px}
.rk{display:flex;gap:12px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}.rk:first-of-type{border-top:0}.rk .n{width:48px;font-size:34px;color:var(--gold);text-align:center}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--bg);border:2px solid var(--tx);padding:4px 18px;display:none;z-index:60;box-shadow:var(--glow)}
.empty{text-align:center;padding:40px 10px;color:var(--mu)}
#boot{position:fixed;inset:16px;z-index:70;background:#010a03;border-radius:28px!important;padding:8vh 8vw;color:var(--tx);text-shadow:var(--glow);font-size:24px;line-height:1.4;overflow:hidden;cursor:pointer;transition:opacity .5s}
#boot p{margin:0;white-space:nowrap;overflow:hidden;width:0;animation:type 1s steps(40) forwards}
#boot p:nth-child(1){animation-delay:.1s}#boot p:nth-child(2){animation-delay:.9s}#boot p:nth-child(3){animation-delay:1.5s}#boot p:nth-child(4){animation-delay:2.1s}#boot p:nth-child(5){animation-delay:2.7s}
@keyframes type{to{width:100%}}
@media(max-width:700px){body{padding:6px}.w{height:calc(100vh - 12px);border-width:7px;padding:14px 12px 50px}body:after,#boot{inset:6px}h1{font-size:30px}.duel{grid-template-columns:1fr}.vs{text-align:center}.rk img{width:84px}}
#boot p:nth-child(6){animation-delay:3.3s}
.logo{width:62px;height:62px;border:2px solid var(--tx);display:grid;place-items:center;font-size:44px;line-height:1;position:relative;box-shadow:var(--glow),inset 0 0 14px rgba(61,255,122,.25);animation:pulse 3s ease-in-out infinite}
.logo:before,.logo:after{content:"";position:absolute;width:10px;height:10px;background:var(--bg)}.logo:before{left:-2px;top:-2px;border-right:2px solid var(--tx);border-bottom:2px solid var(--tx)}.logo:after{right:-2px;bottom:-2px;border-left:2px solid var(--tx);border-top:2px solid var(--tx)}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(61,255,122,.95),0 0 34px rgba(61,255,122,.35),inset 0 0 18px rgba(61,255,122,.35)}}
#ft{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:28px;width:min(1376px,calc(100vw - 56px));display:flex;align-items:center;gap:18px;padding:3px 18px;background:var(--bg);border-top:2px solid var(--line);font-size:18px;text-transform:uppercase;text-shadow:var(--glow)}
#ft .xp{flex:1;height:10px;border:1px solid var(--tx);padding:1px;min-width:60px}#ft .xp i{display:block;height:100%;background:var(--tx);box-shadow:var(--glow)}#ft .fr{color:var(--mu)}
@media(max-width:700px){#ft{bottom:13px;width:calc(100vw - 26px);gap:10px;font-size:16px}#ft .fr{display:none}.logo{width:48px;height:48px;font-size:34px}}
</style></head><body><div class="w">
<header><div style="display:flex;gap:16px;align-items:center"><div class="logo">MO</div><div><h1>MO-BOY <i>3000</i></h1><div class="mu" id="sub"></div></div></div><div class="row" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="b g" onclick="sync(true)">⟳ Sync now</button><div class="tabs" id="tabs"></div></div></header>
<div id="app"></div></div><div id="ft"></div><div id="toast"></div>
<div id="boot"><p>MO-BOY 3000 PERSONAL GAME PROCESSOR</p><p>(C) MO-TEC INDUSTRIES // ITSMADEBYMO.COM</p><p>&gt; LOADING GAME DATABASE ..........</p><p>&gt; ESTABLISHING STEAM UPLINK ....... OK</p><p>&gt; USER RECOGNIZED: MO</p><p>&gt; WELCOME BACK, MO. PRESS ANY KEY.</p></div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={lib:[],meta:{},wish:[]},tab='lib',q='',flt='all',sort='name',lim=120,tm,stateOK=true,last=null,priv=false,RES=[],qs='',duel=null,dt;
const STAT=['Want to play','Playing','Finished','Dropped'];
const gm=id=>S.meta[id]||{};
const sm=(id,k,v)=>{(S.meta[id]=S.meta[id]||{})[k]=v;persist();render()};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const bg=g=>{const h=hue(g.n);return `linear-gradient(135deg,hsl(${h} 55% 32%),hsl(${(h+50)%360} 60% 18%))`};
const IMG=id=>`https://cdn.cloudflare.steamstatic.com/steam/apps/${id}/header.jpg`;
const num=id=>/^\d+$/.test(id);
const store=g=>'https://store.steampowered.com/app/'+g.id;
const art=(g,extra='')=>`<div class="art" style="background:${bg(g)}">${esc(g.n.slice(0,1).toUpperCase())}${num(g.id)?`<img loading="lazy" alt="" src="${IMG(g.id)}" onerror="this.remove()">`:''}${extra}</div>`;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',4000)}
async function api(p,o){o=o||{};o.headers=Object.assign({'x-pass':localStorage.getItem('shpw')||''},o.headers);const r=await fetch(p,o);
 if(r.status==401){const x=prompt('Site password');if(x){localStorage.setItem('shpw',x);return api(p,o)}throw new Error('auth')}return r}
function persist(){clearTimeout(tm);tm=setTimeout(async()=>{const j=JSON.stringify(S);try{localStorage.setItem('steamhub',j)}catch(e){}
 if(stateOK){try{const r=await api('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:j});if(r.status==501)stateOK=false}catch(e){}}},600)}
async function sync(manual){try{const r=await api('/api/library');const j=await r.json();
 if(!r.ok){if(manual)toast('Sync failed: '+(j.error||r.status));return}
 priv=!!j.private;last=new Date();if(priv){render();if(manual)toast('Steam hides your games. Set “Game details” to Public.');return}
 const by={};S.lib.forEach(g=>by[g.id]=g);let add=[];
 j.games.forEach(g=>{if(by[g.id]){by[g.id].h=g.h;by[g.id].n=g.n}else{g.a=Date.now();S.lib.push(g);add.push(g)}});
 add.forEach(g=>{const w=S.wish.find(x=>x.id==g.id);if(w){if(w.m)(S.meta[g.id]=S.meta[g.id]||{}).m=1;S.wish=S.wish.filter(x=>x.id!=g.id)}});
 if(add.length){persist();toast(add.length==1?'New game added: '+add[0].n:add.length+' new games added')}else if(manual)toast('Library is up to date');
 render()}catch(e){if(manual)toast('Could not reach the server')}}
function stars(id){const r=gm(id).r||0;return `<div class="st" title="Click to rate (half stars). Same value clears." onclick="rate(event,'${id}')" style="background-image:linear-gradient(90deg,var(--gold) ${r*20}%,#0f3a1c ${r*20}%)">★★★★★</div>`}
function rate(e,id){const b=e.currentTarget.getBoundingClientRect();let v=Math.min(5,Math.max(.5,Math.ceil((e.clientX-b.left)/b.width*10)/2));sm(id,'r',gm(id).r==v?0:v)}
function tile(g){const m=gm(g.id);return `<div class="g">${art(g,`<button class="mb ${m.m?'on':''}" onclick="sm('${g.id}','m',${m.m?0:1})">${m.m?'★ Must play':'☆ Must play'}</button>`)}
 <div class="gb"><div class="nm">${esc(g.n)}</div><div class="mu">${g.h?g.h+' h played':'Never played'}</div>${stars(g.id)}
 <select onchange="sm('${g.id}','s',this.value)"><option value="">No status</option>${STAT.map(s=>`<option ${m.s==s?'selected':''}>${s}</option>`).join('')}</select>
 <div class="lk"><a href="${store(g)}" target="_blank" rel="noopener">Steam store</a><a href="steam://run/${g.id}">Launch</a></div></div></div>`}
function view(){let a=S.lib.filter(g=>g.n.toLowerCase().includes(q.toLowerCase()));const f={must:g=>gm(g.id).m,rated:g=>gm(g.id).r,unrated:g=>!gm(g.id).r,unplayed:g=>!g.h};
 if(f[flt])a=a.filter(f[flt]);else if(STAT.includes(flt))a=a.filter(g=>gm(g.id).s==flt);
 const so={name:(x,y)=>x.n.localeCompare(y.n),hours:(x,y)=>y.h-x.h,rating:(x,y)=>(gm(y.id).r||0)-(gm(x.id).r||0),elo:(x,y)=>(gm(y.id).e||1000)-(gm(x.id).e||1000),added:(x,y)=>(y.a||0)-(x.a||0)};return a.sort(so[sort])}
function render(){const L=S.lib;ftr();
 $('#sub').textContent='OPERATOR: MO // '+(L.length?L.length+' GAMES // ':'')+(last?'UPLINK OK '+last.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' // AUTO-SYNC ON':'CONNECTING TO STEAM…');
 $('#tabs').innerHTML=[['lib','Library'],['must','Must play'],['disc','Discover'],['wish','Wishlist'],['rank','Ranking']].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 if(tab=='disc'){disc();return}if(tab=='wish'){wish();return}if(tab=='rank'){rank();return}
 const rated=L.filter(g=>gm(g.id).r),avg=rated.length?(rated.reduce((s,g)=>s+gm(g.id).r,0)/rated.length).toFixed(2):'—';
 const base=tab=='must'?'must':flt;const V=(()=>{const o=flt;flt=base;const v=view();flt=o;return v})();
 let h=`<div class="stats"><div class="k"><b>${L.length}</b><span>Games</span></div><div class="k"><b>${Math.round(L.reduce((s,g)=>s+(g.h||0),0)).toLocaleString()}</b><span>Hours played</span></div><div class="k"><b>${avg}</b><span>Avg rating</span></div><div class="k"><b>${L.filter(g=>gm(g.id).m).length}</b><span>Must play</span></div><div class="k"><b>${L.filter(g=>!g.h).length}</b><span>Never played</span></div></div>`;
 if(priv)h+=`<div class="p"><h2>Your Steam library is hidden</h2><div class="mu">Steam → Profile → Edit Profile → Privacy → set <b>Game details</b> to Public, then press Sync now.</div></div>`;
 h+=`<div class="bar"><input id="q" placeholder="Search your games…" value="${esc(q)}" oninput="q=this.value;lim=120;keep()" style="flex:1;min-width:180px"><select onchange="sort=this.value;render()">${[['name','Name A–Z'],['hours','Most played'],['rating','Highest rated'],['elo','My ranking'],['added','Recently added']].map(o=>`<option value="${o[0]}" ${sort==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
 if(tab=='lib')h+=`<div class="bar">${[['all','All'],['rated','Rated'],['unrated','Unrated'],['unplayed','Never played'],...STAT.map(s=>[s,s])].map(c=>`<button class="chip ${flt==c[0]?'on':''}" onclick="flt='${c[0]}';lim=120;render()">${c[1]}</button>`).join('')}</div>`;
 if(!L.length)h+=`<div class="empty"><h2 style="color:var(--tx)">Waiting for your Steam library…</h2><p>If this stays empty, check the setup steps in the README.</p></div>`;
 else if(!V.length)h+=`<div class="empty">${tab=='must'?'Nothing flagged yet. Hit ☆ Must play on any game.':'No games match.'}</div>`;
 else h+=`<div class="grid">${V.slice(0,lim).map(tile).join('')}</div>${V.length>lim?`<div class="empty"><button class="b g" onclick="lim+=240;render()">Show more (${V.length-lim} left)</button></div>`:''}`;
 $('#app').innerHTML=h}
function ftr(){const H=S.lib.reduce((s,g)=>s+(g.h||0),0),lv=Math.floor(Math.sqrt(H))+1,lo=(lv-1)*(lv-1),hi=lv*lv,pc=Math.min(100,(H-lo)/(hi-lo)*100),T=lv<5?'ROOKIE':lv<15?'WANDERER':lv<30?'VETERAN':lv<60?'LEGEND':'GRANDMASTER';
 $('#ft').innerHTML=`<span>USER: MO</span><span title="Level = square root of your total play hours">LVL ${lv} ${T}</span><span class="xp"><i style="width:${pc}%"></i></span><span class="fr">ITSMADEBYMO.COM</span>`}
function go(t){tab=t;lim=120;if(t=='lib')flt='all';render()}
function keep(){const p=$('#q').selectionStart;render();const e=$('#q');e.focus();e.setSelectionRange(p,p)}
function disc(){$('#app').innerHTML=`<div class="p"><h2>Discover games</h2><div class="mu">Searches the entire Steam store. Games you already own are marked.</div><div class="bar" style="margin:10px 0 0"><input id="ds" placeholder="Search Steam… e.g. survival co-op" value="${esc(qs)}" oninput="qs=this.value;clearTimeout(dt);dt=setTimeout(doSearch,350)" style="flex:1;min-width:220px"></div></div><div id="res"></div>`;showRes()}
async function doSearch(){if(qs.trim().length<2){RES=[];showRes();return}$('#res').innerHTML='<div class="empty">Searching…</div>';
 try{const r=await api('/api/search?q='+encodeURIComponent(qs.trim()));const j=await r.json();RES=j.items||[];if(!r.ok)toast('Search failed');}catch(e){RES=[]}showRes()}
function showRes(){const el=$('#res');if(!el)return;if(!RES.length){el.innerHTML=qs.length>1?'<div class="empty">No results.</div>':'';return}
 const own=new Set(S.lib.map(g=>g.id)),wl=new Map(S.wish.map(w=>[w.id,w]));
 el.innerHTML=`<div class="grid">${RES.map(i=>{const o=own.has(i.id),w=wl.get(i.id);return `<div class="g">${art({id:i.id,n:i.n},o?'<span class="bg">✓ Owned</span>':'')}<div class="gb"><div class="nm">${esc(i.n)}</div><div class="mu">${esc(i.price)}${i.meta?' · Metascore '+esc(i.meta):''}</div>
 <div class="row" style="display:flex;gap:6px;flex-wrap:wrap">${o?'':`<button class="b ${w?'on':'g'}" onclick="addW('${i.id}',0)">${w?'On wishlist':'+ Wishlist'}</button><button class="b ${w&&w.m?'on':''}" onclick="addW('${i.id}',1)">★ Must play</button>`}</div><div class="lk"><a href="${store(i)}" target="_blank" rel="noopener">Steam store</a></div></div></div>`}).join('')}</div>`}
function addW(id,m){const i=RES.find(x=>x.id==id);if(!i)return;let w=S.wish.find(x=>x.id==id);if(!w){w={id,n:i.n,price:i.price,m:0,ts:Date.now()};S.wish.push(w)}w.m=m?(w.m?0:1):w.m;persist();showRes()}
function wish(){const W=[...S.wish].sort((a,b)=>(b.m||0)-(a.m||0)||b.ts-a.ts);
 $('#app').innerHTML=`<div class="p"><h2>Wishlist <span class="mu">· ${W.length} games · ★ Must play first</span></h2><div class="mu">Add games from the Discover tab. When you buy one, it appears in your library automatically.</div></div>`+(W.length?`<div class="grid">${W.map(w=>`<div class="g">${art(w,`<button class="mb ${w.m?'on':''}" onclick="togW('${w.id}')">${w.m?'★ Must play':'☆ Must play'}</button>`)}<div class="gb"><div class="nm">${esc(w.n)}</div><div class="mu">${esc(w.price||'')}</div><div class="lk"><a href="${store(w)}" target="_blank" rel="noopener">Steam store</a><a href="#" onclick="delW('${w.id}');return false">Remove</a></div></div></div>`).join('')}</div>`:'<div class="empty">Your wishlist is empty. Try the Discover tab.</div>')}
const togW=id=>{const w=S.wish.find(x=>x.id==id);if(w)w.m=w.m?0:1;persist();render()},delW=id=>{S.wish=S.wish.filter(x=>x.id!=id);persist();render()};
function newDuel(){const P=S.lib.filter(g=>gm(g.id).r||g.h>0);const pool=P.length>=2?P:S.lib;if(pool.length<2){duel=null;return}
 const a=pool[Math.random()*pool.length|0];let b;do{b=pool[Math.random()*pool.length|0]}while(b.id==a.id);duel=[a,b]}
function pickD(i){const w=duel[i],l=duel[1-i],ew=gm(w.id).e||1000,el=gm(l.id).e||1000,x=1/(1+Math.pow(10,(el-ew)/400));
 (S.meta[w.id]=S.meta[w.id]||{}).e=Math.round(ew+32*(1-x));(S.meta[l.id]=S.meta[l.id]||{}).e=Math.round(el-32*(1-x));(S.meta[w.id].d=(S.meta[w.id].d||0)+1);(S.meta[l.id].d=(S.meta[l.id].d||0)+1);persist();newDuel();rank()}
function rank(){if(!duel)newDuel();const E=S.lib.filter(g=>gm(g.id).e!==undefined).sort((a,b)=>gm(b.id).e-gm(a.id).e).slice(0,50);
 const T=S.lib.filter(g=>gm(g.id).r).sort((a,b)=>gm(b.id).r-gm(a.id).r||b.h-a.h).slice(0,20);
 const card=(g,i)=>`<div class="g" onclick="pickD(${i})">${art(g)}<div class="gb"><div class="nm">${esc(g.n)}</div><div class="mu">${g.h?g.h+' h':'Never played'}</div></div></div>`;
 const row=(g,i,s)=>`<div class="rk"><div class="n">${i+1}</div><div style="position:relative;width:120px;aspect-ratio:460/215;border-radius:6px;overflow:hidden;background:${bg(g)};flex:none">${num(g.id)?`<img src="${IMG(g.id)}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.remove()">`:''}</div><div style="flex:1;min-width:0"><b>${esc(g.n)}</b><div class="mu">${s}</div></div></div>`;
 $('#app').innerHTML=`<div class="p"><h2>Head-to-head</h2><div class="mu">Which game is better? Each pick updates your personal ranking (Elo). The more you vote, the more accurate it gets.</div>
 ${duel?`<div class="duel" style="margin-top:14px">${card(duel[0],0)}<div class="vs">VS</div>${card(duel[1],1)}</div><div class="row" style="display:flex;gap:8px;margin-top:12px"><button class="b g" onclick="newDuel();rank()">Skip</button></div>`:'<div class="empty">You need at least 2 games first.</div>'}</div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))"><div class="p"><h2>My ranking <span class="mu">· from head-to-head</span></h2>${E.map((g,i)=>row(g,i,'Score '+gm(g.id).e+' · '+(gm(g.id).d||0)+' duels')).join('')||'<div class="mu">No duels yet. Pick a winner above.</div>'}</div>
 <div class="p"><h2>Top rated <span class="mu">· by stars</span></h2>${T.map((g,i)=>row(g,i,'★ '+gm(g.id).r+' · '+(g.h||0)+' h')).join('')||'<div class="mu">Rate some games with stars first.</div>'}</div></div>`}
(async()=>{try{const x=localStorage.getItem('steamhub');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}render();
 try{const r=await api('/api/state');if(r.status==501)stateOK=false;else{const j=await r.json();if(j.state){S=Object.assign({lib:[],meta:{},wish:[]},j.state)}}}catch(e){}
 const bt=$('#boot');const hide=()=>{bt.style.opacity=0;setTimeout(()=>bt.remove(),500)};try{if(sessionStorage.getItem('booted'))bt.remove();else{sessionStorage.setItem('booted',1);setTimeout(hide,4600);bt.onclick=hide;addEventListener('keydown',hide,{once:true})}}catch(e){setTimeout(hide,4600)}
 render();sync(false);setInterval(()=>sync(false),120000);addEventListener('focus',()=>sync(false))})();
</script></body></html>
