<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steam Hub</title>
<style>
:root{color-scheme:dark;--bg:#0b1118;--sf:#111a24;--sf2:#182432;--line:#233246;--tx:#e8eef5;--mu:#8497ad;--ac:#66c0f4;--gold:#f5c542;box-sizing:border-box}
*{box-sizing:inherit}body{margin:0;background:radial-gradient(900px 420px at 80% -10%,#1b3a57,transparent),var(--bg);color:var(--tx);font:14px/1.5 "Inter","Segoe UI",system-ui,sans-serif;min-height:100vh}
.w{max-width:1360px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) 20px calc(60px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}h1 i{font-style:normal;color:var(--ac)}.mu{color:var(--mu);font-size:12px}
.tabs{display:flex;gap:4px;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:4px;flex-wrap:wrap}
.tabs button{background:none;border:0;color:var(--mu);font:inherit;font-weight:600;padding:7px 15px;border-radius:7px;cursor:pointer}.tabs button.on{background:var(--sf2);color:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:12px 16px}.k b{display:block;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.k span{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select{background:var(--sf);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 11px;font:inherit;outline:0;max-width:100%}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(102,192,244,.16)}
.chip{background:var(--sf);border:1px solid var(--line);color:var(--mu);border-radius:99px;padding:5px 13px;cursor:pointer;font:inherit;font-size:13px}.chip.on{background:rgba(102,192,244,.15);border-color:var(--ac);color:#fff}
button.b{background:var(--ac);color:#06202f;border:0;font:inherit;font-weight:700;border-radius:8px;padding:7px 13px;cursor:pointer}button.b:hover{filter:brightness(1.1)}button.b.g{background:var(--sf2);color:var(--tx);border:1px solid var(--line)}button.b.on{background:var(--gold);color:#2a1e00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.g{background:var(--sf);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:.15s}.g:hover{border-color:#355070;transform:translateY(-2px);box-shadow:0 12px 30px #0008}
.art{aspect-ratio:460/215;position:relative;overflow:hidden;display:grid;place-items:center;font-size:34px;font-weight:800;color:#fff9}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mb{position:absolute;top:8px;right:8px;background:rgba(8,14,20,.7);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}.mb.on{background:var(--gold);color:#2a1e00;border-color:var(--gold)}
.bg{position:absolute;left:8px;top:8px;background:rgba(8,14,20,.7);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}
.gb{padding:11px 13px;display:flex;flex-direction:column;gap:6px;flex:1}.nm{font-weight:650;line-height:1.25}
.st{font-size:22px;line-height:1;cursor:pointer;width:max-content;color:transparent;-webkit-background-clip:text;background-clip:text;user-select:none}
.lk{display:flex;gap:12px;font-size:12px;margin-top:auto;flex-wrap:wrap}a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.p{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}.p h2{margin:0 0 6px;font-size:16px}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}.duel .g{cursor:pointer}.vs{color:var(--mu);font-weight:800}
.rk{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.rk:first-of-type{border-top:0}.rk img{width:120px;aspect-ratio:460/215;object-fit:cover;border-radius:6px;background:var(--sf2)}.rk .n{width:34px;font-size:20px;font-weight:800;color:var(--ac);text-align:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d3248;border:1px solid var(--ac);border-radius:10px;padding:10px 16px;display:none;z-index:9}
.empty{text-align:center;padding:50px 10px;color:var(--mu)}
@media(max-width:700px){.duel{grid-template-columns:1fr}.vs{text-align:center}.rk img{width:84px}}
</style></head><body><div class="w">
<header><div><h1>Steam <i>Hub</i></h1><div class="mu" id="sub"></div></div><div class="row" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="b g" onclick="sync(true)">⟳ Sync now</button><div class="tabs" id="tabs"></div></div></header>
<div id="app"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={lib:[],meta:{},wish:[]},tab='lib',q='',flt='all',sort='name',lim=120,tm,stateOK=true,last=null,priv=false,RES=[],qs='',duel=null,dt;
const STAT=['Want to play','Playing','Finished','Dropped'];
const gm=id=>S.meta[id]||{};
const sm=(id,k,v)=>{(S.meta[id]=S.meta[id]||{})[k]=v;persist();render()};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const bg=g=>{const h=hue(g.n);return `linear-gradient(135deg,hsl(${h} 55% 32%),hsl(${(h+50)%360} 60% 18%))`};
const IMG=id=>`https://cdn.cloudflare.steamstatic.com/steam/apps/${id}/header.jpg`;
const num=id=>/^\d+$/.test(id);
const store=g=>'https://store.steampowered.com/app/'+g.id;
const art=(g,extra='')=>`<div class="art" style="background:${bg(g)}">${esc(g.n.slice(0,1).toUpperCase())}${num(g.id)?`<img loading="lazy" alt="" src="${IMG(g.id)}" onerror="this.remove()">`:''}${extra}</div>`;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',4000)}
async function api(p,o){o=o||{};o.headers=Object.assign({'x-pass':localStorage.getItem('shpw')||''},o.headers);const r=await fetch(p,o);
 if(r.status==401){const x=prompt('Site password');if(x){localStorage.setItem('shpw',x);return api(p,o)}throw new Error('auth')}return r}
function persist(){clearTimeout(tm);tm=setTimeout(async()=>{const j=JSON.stringify(S);try{localStorage.setItem('steamhub',j)}catch(e){}
 if(stateOK){try{const r=await api('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:j});if(r.status==501)stateOK=false}catch(e){}}},600)}
async function sync(manual){try{const r=await api('/api/library');const j=await r.json();
 if(!r.ok){if(manual)toast('Sync failed: '+(j.error||r.status));return}
 priv=!!j.private;last=new Date();if(priv){render();if(manual)toast('Steam hides your games. Set “Game details” to Public.');return}
 const by={};S.lib.forEach(g=>by[g.id]=g);let add=[];
 j.games.forEach(g=>{if(by[g.id]){by[g.id].h=g.h;by[g.id].n=g.n}else{g.a=Date.now();S.lib.push(g);add.push(g)}});
 add.forEach(g=>{const w=S.wish.find(x=>x.id==g.id);if(w){if(w.m)(S.meta[g.id]=S.meta[g.id]||{}).m=1;S.wish=S.wish.filter(x=>x.id!=g.id)}});
 if(add.length){persist();toast(add.length==1?'New game added: '+add[0].n:add.length+' new games added')}else if(manual)toast('Library is up to date');
 render()}catch(e){if(manual)toast('Could not reach the server')}}
function stars(id){const r=gm(id).r||0;return `<div class="st" title="Click to rate (half stars). Same value clears." onclick="rate(event,'${id}')" style="background-image:linear-gradient(90deg,var(--gold) ${r*20}%,#2a3b50 ${r*20}%)">★★★★★</div>`}
function rate(e,id){const b=e.currentTarget.getBoundingClientRect();let v=Math.min(5,Math.max(.5,Math.ceil((e.clientX-b.left)/b.width*10)/2));sm(id,'r',gm(id).r==v?0:v)}
function tile(g){const m=gm(g.id);return `<div class="g">${art(g,`<button class="mb ${m.m?'on':''}" onclick="sm('${g.id}','m',${m.m?0:1})">${m.m?'★ Must play':'☆ Must play'}</button>`)}
 <div class="gb"><div class="nm">${esc(g.n)}</div><div class="mu">${g.h?g.h+' h played':'Never played'}</div>${stars(g.id)}
 <select onchange="sm('${g.id}','s',this.value)"><option value="">No status</option>${STAT.map(s=>`<option ${m.s==s?'selected':''}>${s}</option>`).join('')}</select>
 <div class="lk"><a href="${store(g)}" target="_blank" rel="noopener">Steam store</a><a href="steam://run/${g.id}">Launch</a></div></div></div>`}
function view(){let a=S.lib.filter(g=>g.n.toLowerCase().includes(q.toLowerCase()));const f={must:g=>gm(g.id).m,rated:g=>gm(g.id).r,unrated:g=>!gm(g.id).r,unplayed:g=>!g.h};
 if(f[flt])a=a.filter(f[flt]);else if(STAT.includes(flt))a=a.filter(g=>gm(g.id).s==flt);
 const so={name:(x,y)=>x.n.localeCompare(y.n),hours:(x,y)=>y.h-x.h,rating:(x,y)=>(gm(y.id).r||0)-(gm(x.id).r||0),elo:(x,y)=>(gm(y.id).e||1000)-(gm(x.id).e||1000),added:(x,y)=>(y.a||0)-(x.a||0)};return a.sort(so[sort])}
function render(){const L=S.lib;
 $('#sub').textContent=(L.length?L.length+' games · ':'')+(last?'synced '+last.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' · auto-sync on':'connecting to Steam…');
 $('#tabs').innerHTML=[['lib','Library'],['must','Must play'],['disc','Discover'],['wish','Wishlist'],['rank','Ranking']].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 if(tab=='disc'){disc();return}if(tab=='wish'){wish();return}if(tab=='rank'){rank();return}
 const rated=L.filter(g=>gm(g.id).r),avg=rated.length?(rated.reduce((s,g)=>s+gm(g.id).r,0)/rated.length).toFixed(2):'—';
 const base=tab=='must'?'must':flt;const V=(()=>{const o=flt;flt=base;const v=view();flt=o;return v})();
 let h=`<div class="stats"><div class="k"><b>${L.length}</b><span>Games</span></div><div class="k"><b>${Math.round(L.reduce((s,g)=>s+(g.h||0),0)).toLocaleString()}</b><span>Hours played</span></div><div class="k"><b>${avg}</b><span>Avg rating</span></div><div class="k"><b>${L.filter(g=>gm(g.id).m).length}</b><span>Must play</span></div><div class="k"><b>${L.filter(g=>!g.h).length}</b><span>Never played</span></div></div>`;
 if(priv)h+=`<div class="p"><h2>Your Steam library is hidden</h2><div class="mu">Steam → Profile → Edit Profile → Privacy → set <b>Game details</b> to Public, then press Sync now.</div></div>`;
 h+=`<div class="bar"><input id="q" placeholder="Search your games…" value="${esc(q)}" oninput="q=this.value;lim=120;keep()" style="flex:1;min-width:180px"><select onchange="sort=this.value;render()">${[['name','Name A–Z'],['hours','Most played'],['rating','Highest rated'],['elo','My ranking'],['added','Recently added']].map(o=>`<option value="${o[0]}" ${sort==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
 if(tab=='lib')h+=`<div class="bar">${[['all','All'],['rated','Rated'],['unrated','Unrated'],['unplayed','Never played'],...STAT.map(s=>[s,s])].map(c=>`<button class="chip ${flt==c[0]?'on':''}" onclick="flt='${c[0]}';lim=120;render()">${c[1]}</button>`).join('')}</div>`;
 if(!L.length)h+=`<div class="empty"><h2 style="color:var(--tx)">Waiting for your Steam library…</h2><p>If this stays empty, check the setup steps in the README.</p></div>`;
 else if(!V.length)h+=`<div class="empty">${tab=='must'?'Nothing flagged yet. Hit ☆ Must play on any game.':'No games match.'}</div>`;
 else h+=`<div class="grid">${V.slice(0,lim).map(tile).join('')}</div>${V.length>lim?`<div class="empty"><button class="b g" onclick="lim+=240;render()">Show more (${V.length-lim} left)</button></div>`:''}`;
 $('#app').innerHTML=h}
function go(t){tab=t;lim=120;if(t=='lib')flt='all';render()}
function keep(){const p=$('#q').selectionStart;render();const e=$('#q');e.focus();e.setSelectionRange(p,p)}
function disc(){$('#app').innerHTML=`<div class="p"><h2>Discover games</h2><div class="mu">Searches the entire Steam store. Games you already own are marked.</div><div class="bar" style="margin:10px 0 0"><input id="ds" placeholder="Search Steam… e.g. survival co-op" value="${esc(qs)}" oninput="qs=this.value;clearTimeout(dt);dt=setTimeout(doSearch,350)" style="flex:1;min-width:220px"></div></div><div id="res"></div>`;showRes()}
async function doSearch(){if(qs.trim().length<2){RES=[];showRes();return}$('#res').innerHTML='<div class="empty">Searching…</div>';
 try{const r=await api('/api/search?q='+encodeURIComponent(qs.trim()));const j=await r.json();RES=j.items||[];if(!r.ok)toast('Search failed');}catch(e){RES=[]}showRes()}
function showRes(){const el=$('#res');if(!el)return;if(!RES.length){el.innerHTML=qs.length>1?'<div class="empty">No results.</div>':'';return}
 const own=new Set(S.lib.map(g=>g.id)),wl=new Map(S.wish.map(w=>[w.id,w]));
 el.innerHTML=`<div class="grid">${RES.map(i=>{const o=own.has(i.id),w=wl.get(i.id);return `<div class="g">${art({id:i.id,n:i.n},o?'<span class="bg">✓ Owned</span>':'')}<div class="gb"><div class="nm">${esc(i.n)}</div><div class="mu">${esc(i.price)}${i.meta?' · Metascore '+esc(i.meta):''}</div>
 <div class="row" style="display:flex;gap:6px;flex-wrap:wrap">${o?'':`<button class="b ${w?'on':'g'}" onclick="addW('${i.id}',0)">${w?'On wishlist':'+ Wishlist'}</button><button class="b ${w&&w.m?'on':''}" onclick="addW('${i.id}',1)">★ Must play</button>`}</div><div class="lk"><a href="${store(i)}" target="_blank" rel="noopener">Steam store</a></div></div></div>`}).join('')}</div>`}
function addW(id,m){const i=RES.find(x=>x.id==id);if(!i)return;let w=S.wish.find(x=>x.id==id);if(!w){w={id,n:i.n,price:i.price,m:0,ts:Date.now()};S.wish.push(w)}w.m=m?(w.m?0:1):w.m;persist();showRes()}
function wish(){const W=[...S.wish].sort((a,b)=>(b.m||0)-(a.m||0)||b.ts-a.ts);
 $('#app').innerHTML=`<div class="p"><h2>Wishlist <span class="mu">· ${W.length} games · ★ Must play first</span></h2><div class="mu">Add games from the Discover tab. When you buy one, it appears in your library automatically.</div></div>`+(W.length?`<div class="grid">${W.map(w=>`<div class="g">${art(w,`<button class="mb ${w.m?'on':''}" onclick="togW('${w.id}')">${w.m?'★ Must play':'☆ Must play'}</button>`)}<div class="gb"><div class="nm">${esc(w.n)}</div><div class="mu">${esc(w.price||'')}</div><div class="lk"><a href="${store(w)}" target="_blank" rel="noopener">Steam store</a><a href="#" onclick="delW('${w.id}');return false">Remove</a></div></div></div>`).join('')}</div>`:'<div class="empty">Your wishlist is empty. Try the Discover tab.</div>')}
const togW=id=>{const w=S.wish.find(x=>x.id==id);if(w)w.m=w.m?0:1;persist();render()},delW=id=>{S.wish=S.wish.filter(x=>x.id!=id);persist();render()};
function newDuel(){const P=S.lib.filter(g=>gm(g.id).r||g.h>0);const pool=P.length>=2?P:S.lib;if(pool.length<2){duel=null;return}
 const a=pool[Math.random()*pool.length|0];let b;do{b=pool[Math.random()*pool.length|0]}while(b.id==a.id);duel=[a,b]}
function pickD(i){const w=duel[i],l=duel[1-i],ew=gm(w.id).e||1000,el=gm(l.id).e||1000,x=1/(1+Math.pow(10,(el-ew)/400));
 (S.meta[w.id]=S.meta[w.id]||{}).e=Math.round(ew+32*(1-x));(S.meta[l.id]=S.meta[l.id]||{}).e=Math.round(el-32*(1-x));(S.meta[w.id].d=(S.meta[w.id].d||0)+1);(S.meta[l.id].d=(S.meta[l.id].d||0)+1);persist();newDuel();rank()}
function rank(){if(!duel)newDuel();const E=S.lib.filter(g=>gm(g.id).e!==undefined).sort((a,b)=>gm(b.id).e-gm(a.id).e).slice(0,50);
 const T=S.lib.filter(g=>gm(g.id).r).sort((a,b)=>gm(b.id).r-gm(a.id).r||b.h-a.h).slice(0,20);
 const card=(g,i)=>`<div class="g" onclick="pickD(${i})">${art(g)}<div class="gb"><div class="nm">${esc(g.n)}</div><div class="mu">${g.h?g.h+' h':'Never played'}</div></div></div>`;
 const row=(g,i,s)=>`<div class="rk"><div class="n">${i+1}</div><div style="position:relative;width:120px;aspect-ratio:460/215;border-radius:6px;overflow:hidden;background:${bg(g)};flex:none">${num(g.id)?`<img src="${IMG(g.id)}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.remove()">`:''}</div><div style="flex:1;min-width:0"><b>${esc(g.n)}</b><div class="mu">${s}</div></div></div>`;
 $('#app').innerHTML=`<div class="p"><h2>Head-to-head</h2><div class="mu">Which game is better? Each pick updates your personal ranking (Elo). The more you vote, the more accurate it gets.</div>
 ${duel?`<div class="duel" style="margin-top:14px">${card(duel[0],0)}<div class="vs">VS</div>${card(duel[1],1)}</div><div class="row" style="display:flex;gap:8px;margin-top:12px"><button class="b g" onclick="newDuel();rank()">Skip</button></div>`:'<div class="empty">You need at least 2 games first.</div>'}</div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))"><div class="p"><h2>My ranking <span class="mu">· from head-to-head</span></h2>${E.map((g,i)=>row(g,i,'Score '+gm(g.id).e+' · '+(gm(g.id).d||0)+' duels')).join('')||'<div class="mu">No duels yet. Pick a winner above.</div>'}</div>
 <div class="p"><h2>Top rated <span class="mu">· by stars</span></h2>${T.map((g,i)=>row(g,i,'★ '+gm(g.id).r+' · '+(g.h||0)+' h')).join('')||'<div class="mu">Rate some games with stars first.</div>'}</div></div>`}
(async()=>{try{const x=localStorage.getItem('steamhub');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}render();
 try{const r=await api('/api/state');if(r.status==501)stateOK=false;else{const j=await r.json();if(j.state){S=Object.assign({lib:[],meta:{},wish:[]},j.state)}}}catch(e){}
 render();sync(false);setInterval(()=>sync(false),120000);addEventListener('focus',()=>sync(false))})();
</script></body></html>
